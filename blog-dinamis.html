
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Artikel Vit Gadget</title>
    <meta name="description" content="Baca artikel terbaru dari Vit Gadget.">

    <meta property="og:type" content="article">
    <meta property="og:title" content="Artikel Vit Gadget">
    <meta property="og:description" content="Baca artikel terbaru dari Vit Gadget.">
    <meta property="og:image" content="">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #263445;
            line-height: 1.8;
        }

        .blog-header {
            background: #17324d;
            padding: 20px;
        }

        .blog-header-inner {
            max-width: 1000px;
            margin: auto;
        }

        .blog-header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .blog-container {
            max-width: 900px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .blog-article {
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0,0,0,.05);
        }

        .blog-category {
            display: inline-block;
            background: #e8f1fa;
            color: #17324d;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .blog-title {
            font-size: 32px;
            line-height: 1.3;
            margin: 0 0 15px;
            color: #17324d;
        }

        .blog-meta {
            color: #788493;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .blog-featured-image {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .blog-content {
            font-size: 16px;
            overflow-wrap: break-word;
        }

        .blog-content h1,
        .blog-content h2,
        .blog-content h3 {
            color: #17324d;
            line-height: 1.4;
            margin-top: 30px;
        }

        .blog-content img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
        }

        .blog-content a {
            color: #1769aa;
        }

        .blog-content blockquote {
            border-left: 4px solid #17324d;
            margin: 20px 0;
            padding: 10px 20px;
            background: #f5f7fa;
        }

        .blog-back {
            display: inline-block;
            margin-top: 25px;
            color: #17324d;
            font-weight: bold;
            text-decoration: none;
        }

        .blog-message {
            text-align: center;
            padding: 70px 20px;
            color: #667085;
        }

        @media (max-width: 600px) {
            .blog-container {
                margin: 20px auto;
                padding: 0 12px;
            }

            .blog-article {
                padding: 22px 18px;
            }

            .blog-title {
                font-size: 25px;
            }

            .blog-content {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <header class="blog-header">
        <div class="blog-header-inner">
            <a href="/artikel.html">← Kembali ke Artikel Vit Gadget</a>
        </div>
    </header>

    <main class="blog-container">
        <div id="blog-loading" class="blog-message">
            Memuat artikel...
        </div>

        <article id="blog-article" class="blog-article" hidden>
            <span id="blog-category" class="blog-category"></span>

            <h1 id="blog-title" class="blog-title"></h1>

            <div id="blog-meta" class="blog-meta"></div>

            <img
                id="blog-image"
                class="blog-featured-image"
                alt=""
                hidden
            >

            <div id="blog-content" class="blog-content"></div>

            <a href="/artikel.html" class="blog-back">
                ← Kembali ke daftar artikel
            </a>
        </article>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", loadArticle);

        async function loadArticle() {
            const loading = document.getElementById("blog-loading");
            const articleElement = document.getElementById("blog-article");

            const slug = new URLSearchParams(
                window.location.search
            ).get("slug");

            if (!slug) {
                loading.textContent = "Alamat artikel tidak valid.";
                return;
            }

            try {
                const response = await fetch(
                    "/api/articles/detail?slug=" +
                    encodeURIComponent(slug)
                );

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(
                        result.error || "Artikel tidak ditemukan"
                    );
                }

                const article = result.data;

                document.title =
                    (article.seo && article.seo.title) ||
                    article.title + " | Vit Gadget";

                document.querySelector(
                    'meta[name="description"]'
                ).content =
                    (article.seo && article.seo.description) ||
                    article.excerpt ||
                    article.title;

                document.querySelector(
                    'meta[property="og:title"]'
                ).content = article.title;

                document.querySelector(
                    'meta[property="og:description"]'
                ).content = article.excerpt || article.title;

                document.querySelector(
                    'meta[property="og:image"]'
                ).content = article.featured_image || "";

                document.getElementById("blog-category").textContent =
                    article.category || "ARTIKEL VIT GADGET";

                document.getElementById("blog-title").textContent =
                    article.title;

                const date = article.published_at
                    ? new Date(article.published_at).toLocaleDateString(
                        "id-ID",
                        {
                            day: "numeric",
                            month: "long",
                            year: "numeric"
                        }
                    )
                    : "";

                document.getElementById("blog-meta").textContent =
                    (article.author ? "Oleh " + article.author : "") +
                    (article.author && date ? " • " : "") +
                    date;

                const image = document.getElementById("blog-image");

                if (article.featured_image) {
                    try {
                        const imageUrl = new URL(article.featured_image);

                        if (
                            imageUrl.protocol === "https:" ||
                            imageUrl.protocol === "http:"
                        ) {
                            image.src = imageUrl.href;
                            image.alt = article.title;
                            image.hidden = false;
                        }
                    } catch {
                        console.warn("URL gambar tidak valid");
                    }
                }

                document.getElementById("blog-content").innerHTML =
                    sanitizeArticleHTML(article.content || "");

                loading.hidden = true;
                articleElement.hidden = false;

            } catch (error) {
                console.error("Gagal memuat artikel:", error);
                loading.textContent =
                    "Artikel tidak ditemukan atau belum dapat dimuat.";
            }
        }

        // Sanitasi HTML artikel sebelum ditampilkan.
        function sanitizeArticleHTML(html) {
            const allowedTags = new Set([
                "P", "H1", "H2", "H3", "H4",
                "UL", "OL", "LI",
                "STRONG", "B", "EM", "I",
                "A", "BLOCKQUOTE",
                "BR", "HR", "IMG",
                "TABLE", "THEAD", "TBODY",
                "TR", "TH", "TD"
            ]);

            const parser = new DOMParser();
            const parsed = parser.parseFromString(html, "text/html");

            function cleanNode(node) {
                const fragment = document.createDocumentFragment();

                node.childNodes.forEach(child => {
                    if (child.nodeType === Node.TEXT_NODE) {
                        fragment.appendChild(
                            document.createTextNode(child.textContent)
                        );
                        return;
                    }

                    if (child.nodeType !== Node.ELEMENT_NODE) return;

                    if (!allowedTags.has(child.tagName)) {
                        fragment.appendChild(cleanNode(child));
                        return;
                    }

                    const cleanElement = document.createElement(
                        child.tagName.toLowerCase()
                    );

                    if (child.tagName === "A") {
                        const href = child.getAttribute("href");

                        try {
                            const url = new URL(href, window.location.origin);

                            if (
                                ["http:", "https:", "mailto:"].includes(
                                    url.protocol
                                )
                            ) {
                                cleanElement.href = url.href;
                                cleanElement.rel = "noopener noreferrer";
                                cleanElement.target = "_blank";
                            }
                        } catch {}
                    }

                    if (child.tagName === "IMG") {
                        const src = child.getAttribute("src");

                        try {
                            const url = new URL(src, window.location.origin);

                            if (
                                ["http:", "https:"].includes(url.protocol)
                            ) {
                                cleanElement.src = url.href;
                                cleanElement.alt =
                                    child.getAttribute("alt") || "";
                                cleanElement.loading = "lazy";
                            } else {
                                return fragment;
                            }
                        } catch {
                            return fragment;
                        }
                    }

                    cleanElement.appendChild(cleanNode(child));
                    fragment.appendChild(cleanElement);
                });

                return fragment;
            }

            const output = document.createElement("div");
            output.appendChild(cleanNode(parsed.body));
            return output.innerHTML;
        }
    </script>

</body>
</html>
